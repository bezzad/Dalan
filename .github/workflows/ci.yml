name: ci

# DEL-01: the gate is scripts/ci.sh on the owner's computer (GitHub minutes ran out, 2026-11-21); it runs these same steps.
# DEL-06: the server builds main itself (OPS-16). This workflow runs only by hand: to build the Windows agent (DEL-08),
# or to deploy when the server cannot reach GitHub. tests/delivery/ci_workflow_test.sh keeps it and scripts/ci.sh equal.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to the server after all gates pass
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer run waits: cancelling one could stop a deploy half way.
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  OPENSPEC_TELEMETRY: "0"
  CADDY_VERSION: "2.11.9"

jobs:
  # Builds once. The tests and the deploy use these files; nothing builds again.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: client/package-lock.json

      # The server embeds the built client, so the client comes first.
      - name: Client check, build and test
        working-directory: client
        run: npm ci && npm run check && npm run build && npm test

      - name: Build
        run: dotnet build Dalan.slnx -c Release

      - name: Publish release
        run: bash scripts/publish.sh out

      - name: Release smoke test
        run: bash tests/delivery/release_smoke_test.sh out

      # AGT-01: the agent is one native file. The files for Windows and macOS are built by the agent job before a deploy.
      - name: Agent with Native AOT (linux-x64)
        run: |
          bash tests/delivery/agent_smoke_test.sh agent-out linux-x64
          mkdir agent-dist && mv agent-out/dalan agent-dist/dalan-linux-x64

      # tar keeps the file modes (the release must stay executable). ProcessTests run the host build.
      - name: Pack
        run: |
          tar -cf release.tar -C out .
          tar -cf tests.tar tests/*/bin/Release src/Dalan.Host/bin/Release
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: release.tar
          retention-days: 3
      - uses: actions/upload-artifact@v7
        with:
          name: agent-linux-x64
          path: agent-dist
          retention-days: 3
      - uses: actions/upload-artifact@v7
        with:
          name: tests
          path: tests.tar
          retention-days: 1

  # Two machines at the same time: Relay (the longest) and all the others one after another.
  # Fewer machines use fewer billed minutes (each machine costs its start-up time, rounded up to a minute).
  # tests/delivery/ci_workflow_test.sh fails when a test project is missing here.
  test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        projects:
          - Dalan.Relay.Tests
          - Dalan.Admin.Tests Dalan.Architecture.Tests Dalan.Host.Tests Dalan.Identity.Tests Dalan.Sites.Tests Dalan.Telegram.Tests
    name: test (${{ matrix.projects }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v8
        with:
          name: tests
      - name: dotnet test (built once by the build job)
        run: |
          tar -xf tests.tar
          for project in ${{ matrix.projects }}; do
            dotnet "tests/$project/bin/Release/net11.0/$project.dll"
          done

  # The checks that need no .NET build run next to the build.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Specs are valid
        run: npx --yes @fission-ai/openspec@2.1.0 validate --all --strict

      - name: Every rule has a test
        run: |
          bash scripts/check-rules.sh
          bash tests/scripts/check_rules_test.sh
          bash tests/delivery/ci_workflow_test.sh
          bash tests/delivery/install_script_test.sh

      - name: Deploy script tests
        run: |
          bash tests/deploy/deploy_test.sh
          bash tests/deploy/setup_test.sh
          bash tests/deploy/backup_test.sh
          bash tests/deploy/drill_test.sh
          bash tests/deploy/pull_deploy_test.sh

      - name: Install Caddy
        run: |
          file="caddy_${CADDY_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}"
          curl -fsSLO "$base/$file"
          curl -fsSLO "$base/caddy_${CADDY_VERSION}_checksums.txt"
          grep " $file\$" "caddy_${CADDY_VERSION}_checksums.txt" | sha512sum -c -
          sudo tar -xzf "$file" -C /usr/local/bin caddy

      - name: Proxy test
        run: bash tests/proxy/caddy_test.sh

  # The image for local runs and container platforms; production does not use it.
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Docker image
        run: |
          docker build -t dalan .
          docker run -d --name dalan -p 127.0.0.1:18095:8080 dalan
          for _ in $(seq 50); do curl -fs -o /dev/null http://127.0.0.1:18095/health && break; sleep 0.2; done
          curl -fs http://127.0.0.1:18095/health

  # DEL-08: the agent for Windows, built on Windows (Native AOT does not cross systems). Only here: the server's own
  # build keeps the running release's file, so run this workflow with deploy on after an agent change.
  # macOS: each CPU on its own Mac, built and run there (the repository is public since 2026-11-21, so these machines run).
  agent:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - { os: windows-2025, rid: win-x64, from: dalan.exe, file: dalan-windows-x64.exe }
          - { os: macos-26, rid: osx-arm64, from: dalan, file: dalan-macos-arm64 }
          - { os: macos-26-intel, rid: osx-x64, from: dalan, file: dalan-macos-x64 }
    name: agent (${{ matrix.rid }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Agent with Native AOT
        shell: bash
        run: |
          bash tests/delivery/agent_smoke_test.sh agent-out ${{ matrix.rid }} ${{ matrix.run }}
          mkdir agent-dist && mv agent-out/${{ matrix.from }} agent-dist/${{ matrix.file }}
      - uses: actions/upload-artifact@v7
        with:
          name: agent-${{ matrix.rid }}
          path: agent-dist
          retention-days: 3

  deploy:
    needs: [build, test, checks, docker, agent]
    # Only when "Deploy" is ticked (DEL-06: a merge to main reaches the server by the server's own build).
    if: inputs.deploy
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release
      - uses: actions/download-artifact@v8
        with:
          pattern: agent-*
          path: agent-files
          merge-multiple: true

      - name: SSH key
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519

      # The same files the tests passed with; rsync sends only what changed.
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir out && tar -xf release.tar -C out
          # AGT-10: the server serves these files to the one-line install. Artifacts lose the file mode.
          mkdir out/agent && mv agent-files/* out/agent/ && chmod 755 out/agent/*
          bash deploy/deploy.sh out "${GITHUB_SHA::12}"
