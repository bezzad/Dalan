schema: spec-driven

context: |
  Dalan is a relay platform hosted in Iran (see docs/DESIGN.md for the product, docs/ARCHITECTURE.md for decisions).
  Only Layer 1 is in scope now. No user-to-user chat, groups or channels.
  Every limit, expiry, size and domain name is admin-changeable configuration, never hard-coded.
  Before first use of a starting value marked "Assumed" in docs/DESIGN.md section 18, ask the owner in Persian.
  A bot never receives a user's phone number.
  Production runs in Iran without Docker; the running product loads nothing from a foreign host.
  The relay core never mentions Telegram; the Telegram adapter is a plugin.
  Owner is not a native English speaker: write short, simple English.

rules:
  specs:
    - Start every requirement name with a rule ID (AREA-NN, for example OPS-01), unique across all specs.
    - Every scenario must be testable; each scenario maps to at least one test tagged with the rule ID.
  tasks:
    - Write the failing test for a rule before the code for it.
    - Each milestone is one change, reviewed by the owner before apply.
